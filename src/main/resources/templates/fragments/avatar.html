<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Avatar for a MemberView: the Spotify profile picture ringed in the member's colour,
  or coloured initials when there's no picture. sizeClass is 'lg' or 'sm'.
  data-name drives the hover tooltip on small avatars.
-->
<th:block th:fragment="avatar(m, sizeClass)">
    <span class="avatar" th:classappend="${sizeClass}" th:style="${'--c:' + m.colour}"
          th:attr="data-name=${m.name}">
        <img th:if="${m.avatarUrl}" th:src="${m.avatarUrl}" alt="" referrerpolicy="no-referrer">
        <span th:unless="${m.avatarUrl}" class="initials" th:text="${m.initials}">AB</span>
    </span>
</th:block>
</body>
</html>
