server:
  port: 8080
  # X-Forwarded-* / Forwarded headers are ignored by default, so a client can't spoof its scheme, host or IP.
  # Behind a reverse proxy that sets (and strips client-sent) forwarded headers, set FORWARD_HEADERS_STRATEGY=native.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # "secure" is set in SessionCookieConfig: on when APP_BASE_URL is https, overridable with SESSION_COOKIE_SECURE.

spring:
  application:
    name: spotify-reblender
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/reblender}
    username: sa
    password: ""
  sql:
    init:
      mode: always
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID}
            client-secret: ${SPOTIFY_CLIENT_SECRET}
            client-name: Spotify
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            # Spotify requires an exact match; loopback must use 127.0.0.1, not localhost.
            redirect-uri: ${APP_BASE_URL:http://127.0.0.1:8080}/login/oauth2/code/spotify
            # Read top tracks and create/replace the app's own private playlists. playlist-modify-public is only
            # there because Spotify's DELETE /me/library refuses to remove a playlist without it.
            scope:
              - user-top-read
              - playlist-modify-private
              - playlist-modify-public
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id

reblender:
  spotify-api-base-url: https://api.spotify.com/v1
  # Weekly rebuild of every blend with "Update weekly" on (Spring cron: second minute hour day month weekday).
  auto-update:
    cron: ${AUTO_UPDATE_CRON:0 0 6 * * MON}
    zone: ${AUTO_UPDATE_ZONE:Europe/London}
  # Required. Base64 AES-256 key used to encrypt stored Spotify tokens: openssl rand -base64 32
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  # Or a file containing it (Docker secret / TPM-sealed systemd credential). Set only one of the two.
  token-encryption-key-file: ${TOKEN_ENCRYPTION_KEY_FILE:}
