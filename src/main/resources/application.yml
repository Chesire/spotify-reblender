server:
  port: 8080
  # Respect X-Forwarded-* headers when running behind a reverse proxy (e.g. TLS terminator).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: spotify-reblender
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/reblender}
    username: sa
    password: ""
  sql:
    init:
      mode: always
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID}
            client-secret: ${SPOTIFY_CLIENT_SECRET}
            client-name: Spotify
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            # Spotify requires an exact match; loopback must use 127.0.0.1, not localhost.
            redirect-uri: ${APP_BASE_URL:http://127.0.0.1:8080}/login/oauth2/code/spotify
            # Least privilege: read top tracks, create/replace the app's own private playlists. Nothing else.
            scope:
              - user-top-read
              - playlist-modify-private
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id

reblender:
  spotify-api-base-url: https://api.spotify.com/v1
  # Required. Base64 AES-256 key used to encrypt stored Spotify tokens: openssl rand -base64 32
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
