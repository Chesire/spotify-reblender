name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Git | Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Java | Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle | Set up
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Gradle | Build, lint and test
        run: ./gradlew build --no-daemon

      - name: Previews | Print to log
        if: always()
        run: scripts/ci/print-previews.sh

      - name: Previews | Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: page-previews
          path: build/previews/*.html
          if-no-files-found: ignore

      - name: Gradle | Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: build/reports/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Git | Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Docker | Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker | Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: spotify-reblender:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker | Check image runs as non-root
        run: scripts/ci/check-non-root.sh

      - name: App | Check startup is refused without a key
        run: scripts/ci/check-requires-key.sh

      - name: App | Check startup with a key file
        run: scripts/ci/check-key-file.sh

      - name: App | Smoke test
        run: scripts/ci/smoke-test.sh

      - name: App | Check logs contain no secrets
        run: scripts/ci/check-logs-redacted.sh

      - name: App | Check Secure cookie over https
        run: scripts/ci/check-secure-cookie.sh

      - name: Docker | Print container logs
        if: always()
        run: docker logs reblender 2>&1 | tail -n 200 || true
